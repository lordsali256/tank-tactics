services:
  tank-tactics:
    build: .
    container_name: tank-tactics
    restart: unless-stopped
    environment:
      TANK_PUBLIC_ORIGIN: http://192.168.1.10:8878
      TANK_BIND_HOST: 192.168.1.10
      TANK_DATA_DIR: /data
      TANK_COACH_MODEL: qwen2.5-coder:7b
      TANK_OLLAMA_ENDPOINT: http://127.0.0.1:11435/api/chat
      TANK_OLLAMA_LOCATION: Your PC through a private SSH tunnel
    network_mode: host
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://192.168.1.10:8878/play').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    profiles: [server-ai]
    image: ollama/ollama:latest
    container_name: tank-tactics-ollama
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ./ollama:/root/.ollama
    cpus: 6
    mem_limit: 12g
    security_opt:
      - no-new-privileges:true
